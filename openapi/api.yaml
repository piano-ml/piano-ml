openapi: 3.0.0
info:
  title: PianoML API
  version: 1.0.0
servers:
  - url: https://api.pianoml.org
    description: Production HTTPS server
  - url: http://localhost:8080
    description: Local HTTP server

tags:
  - name: genre_tree
    description: Operations to read and modify the genre tree (parent/child relationships)

paths:
  /account/login:
    post:
      tags:
        - account
      summary: Log in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - email
                - password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  username:
                    type: string
                  userId:
                    type: string
                  roles:
                    type: string
                  expire:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
  /account/create:
    post:
      operationId: accountCreatePost
      tags:
        - account
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                name:
                  type: string
              required:
                - email
                - password
                - name
      responses:
        '201':
          description: Account created successfully
        '400':
          description: Bad request
        '403':
          description: User already exists
  /account/userinfo:
    get:
      operationId: accountUserinfoGet
      tags:
        - account
      summary: Get user information
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiInfo'
        '401':
          description: Unauthorized
    put:
      operationId: accountUserinfoPut
      tags:
        - account
      summary: Update user information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserApiInfo'
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiInfo'
        '401':
          description: Unauthorized
  /account/password_reset:
    post:
      operationId: accountPasswordResetPost
      tags:
        - account
      summary: Reset account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        '200':
          description: Password reset email sent
        '400':
          description: Bad request
  /account/create/{token}/confirm:
    get:
      operationId: accountCreateTokenConfirmGet
      tags:
        - account
      summary: Confirm account creation with token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: The token to confirm account creation
      responses:
        '200':
          description: Account confirmed successfully
        '400':
          description: Invalid or expired token
  /account/logout:
    post:
      operationId: accountLogoutPost
      tags:
        - account
      summary: Log out from the account
      description: Expires the auth cookie. POST (not GET) so it is CSRF-protected and cannot be triggered by a link.
      responses:
        '200':
          description: Successfully logged out
        '401':
          description: Unauthorized
  /account/delete:
    post:
      operationId: accountDeletePost
      tags:
        - account
      summary: Delete the current user's own account
      description: >
        For the logged-in user (no password re-check). The user's scores are kept and moved to the "junk" system
        user, then the account and its dependent data (play counts) are deleted and the auth cookie is expired.
        POST rather than DELETE for consistency with logout; CSRF-protected like every write.
      responses:
        '204':
          description: Account deleted
        '401':
          description: Not logged in
        '403':
          description: CSRF token missing or invalid
  /account/token/renew:
    get:
      operationId: accountTokenRenewGet
      tags:
        - account
      summary: Renew an authentication token
      responses:
        '200':
          description: New token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /score:
    post:
      operationId: scorePost
      tags:
        - score
      summary: Create a score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreApiInfo'
      responses:
        '200':
          description: ScoreApiInfo successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreApiInfo'
        '400':
          description: Bad request

  /score/{id}/video/{youtube_id}/{action}:
    post:
      operationId: scoreYoutubeEdit
      tags:
        - score
      summary: Edit a YouTube link associated with a score (add/increment/reduce/remove)
      description: |
        Perform an action on a YouTube link attached to a score. The `youtube_link` path
        parameter should be URL-encoded if it contains characters not valid in a path.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the score
        - name: youtube_id
          in: path
          required: true
          schema:
            type: string
          description: The YouTube link or identifier (URL-encoded)
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [upvote, downvote, report, view]
          description: 'The action to perform on the link: plus, minus, or delete'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional body for action-specific payload (e.g., additional metadata)
      responses:
        '200':
          description: YouTube link updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreApiInfo'
        '400':
          description: Bad request
        '404':
          description: Score or YouTube link not found

  /score/search:
    get:
      operationId: scoreSearchGet
      tags:
        - score
      summary: Search a score
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: A keyword
        - name: ownerId
          in: query
          schema:
            type: string
          description: owner
        - name: genreId
          in: query
          schema:
            type: string
          description: genre
        - name: artist
          in: query
          schema:
            type: string
          description: artist name
        - name: artist_slug
          in: query
          schema:
            type: string
          description: artist slug
        - name: genre_slug
          in: query
          schema:
            type: string
          description: genre slug
        - name: etude
          in: query
          schema:
            type: boolean
          description: filter by etude type
        - name: gradeStart
          in: query
          schema:
            type: string
        - name: gradeEnd
          in: query
          schema:
            type: string
        - name: tempo
          in: query
          schema:
            type: string
          description: the level
        - name: fullKey
          in: query
          schema:
            type: string
          description: 'Filter by musical full key (example: "D minor" or "D major")'
        - name: orderBy
          in: query
          schema:
            type: string
            enum: [title_asc, title_desc, grade_asc, grade_desc, uploadedAt_asc, uploadedAt_desc, playCount_asc, playCount_desc]
          description: 'Order results by specified field (optional, no default ordering if not set)'
        - name: offset
          in: query
          schema:
            type: integer
          description: search start at
        - name: limit
          in: query
          schema:
            type: integer
          description: limit results count
        - name: tracks
          in: query
          description: "List of track numbers to filter by (nullable). Examples: null, [1], [1,2]"
          schema:
            type: array
            items:
              type: integer
            nullable: true
          style: form
          explode: true
        - name: description
          in: query
          schema:
            type: string
          description: 'set to NONE to get all with no description'

      responses:
        '200':
          description: ScoreApiInfo retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoreApiInfo'
        '400':
          description: Bad request

  /score/getFullKey:
    get:
      operationId: scoreGetFullKeyGet
      tags:
        - score
      summary: Get available fullKey values
      description: Returns the list of distinct fullKey values stored for scores (e.g. "D major", "D minor").
      responses:
        '200':
          description: List of fullKey strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Bad request

  /score/stats:
    get:
      operationId: scoreStatsGet
      tags:
        - score
      summary: Get counts of public-domain and copyrighted scores
      description: Returns the number of public-domain and copyrighted scores available.
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  "public-domain":
                    type: integer
                    format: int64
                    description: Number of public domain scores
                  copyrighted:
                    type: integer
                    format: int64
                    description: Number of copyrighted scores
                required:
                  - "public-domain"
                  - copyrighted
        '400':
          description: Bad request

  /score/play/stats:
    post:
      operationId: scorePlayStatsPost
      tags:
        - score
      summary: Register that a score has been played
      description: Popularity counter, open to anonymous users. Practice sessions are recorded with PUT /practice/session/{id}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
      responses:
        '200':
          description: Play count registered successfully
        '400':
          description: Bad request

  /score/{id}/video:
    get:
      operationId: scoreIdVideoGet
      tags:
        - score
      summary: Search YouTube videos related to a score
      description: Queries YouTube for videos related to the score's title and composer (piano tutorial).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the score
      responses:
        '200':
          description: List of relevant YouTube videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YoutubeVideoApiInfo'
        '404':
          description: Score not found
        '502':
          description: YouTube API error

  /score/{id}/info:
    get:
      operationId: scoreIdGet
      tags:
        - score
      summary: Retrieve a score by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the score to retrieve
      responses:
        '200':
          description: ScoreApiInfo retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreApiInfo'
        '404':
          description: ScoreApiInfo not found
    put:
      operationId: scoreIdPut
      tags:
        - score
      summary: Update a score by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the score to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreApiInfo'

      responses:
        '200':
          description: ScoreApiInfo retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreApiInfo'
        '403':
          description: Not authorized
        '404':
          description: ScoreApiInfo not found
    delete:
      operationId: scoreIdDelete
      tags:
        - score
      summary: Delete a score by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the score to delete
      responses:
        '204':
          description: Score deleted successfully
        '403':
          description: Not authorized - only owner or admin can delete
        '404':
          description: Score not found

  /score/{slug}:
    get:
      operationId: scoreGetBySlug
      tags:
        - score
      summary: Retrieve a score by its immutable slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: The immutable slug of the score to retrieve
      responses:
        '200':
          description: Score retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreApiInfo'
        '404':
          description: Score not found

  /score/{id}/{type}/{version}/{revision}:
    post:
      operationId: scoreIdTypeVersionRevisionPost
      tags:
        - score
      summary: Upload a binary file for a specific score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the score
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [pdf, musicxml, mxl, midi, metadata, image]
          description: The type of file being uploaded (e.g., pdf or mxml)
        - name: version
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the score
        - name: revision
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the score
        - name: track1
          in: query
          required: false
          schema:
            type: integer
        - name: track2
          in: query
          required: false
          schema:
            type: integer
        - name: makeFingering
          in: query
          required: false
          description: Run automatic fingering detection when packing. Defaults to true when omitted.
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File uploaded successfully
        '400':
          description: Invalid input
        '404':
          description: ScoreApiInfo not found
  /score/{id}/reimport:
    post:
      operationId: scoreIdReimportPost
      tags:
        - score
      summary: Re-import a MIDI score from its original upload with new study tracks
      description: >
        Packs the score again from the file uploaded at import (ori.midi in the score zip), with the study
        tracks given, under the same score record (same id, slug, owner, version). Owner or admin only, and
        only for scores imported from a MIDI file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreReimportRequest'
      responses:
        '200':
          description: Score re-imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreApiInfo'
        '400':
          description: Invalid study tracks, or the original upload is not a MIDI file
        '401':
          description: Not logged in
        '403':
          description: Neither the owner of the score nor an admin
        '404':
          description: Score or original upload not found
  /score/{owner}/{id}/{type}/{version}/{revision}:
    get:
      operationId: scoreOwnerIdTypeVersionRevisionGet
      tags:
        - score
      summary: Download a file for a specific score
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: The User Id
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the score
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [pdf, musicxml, midi, original]
          description: >-
            The type of file to download (e.g., pdf or musicxml). "original" is the file uploaded at import,
            served with its own content type.
        - name: version
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the score
        - name: revision
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the score

      responses:
        '200':
          description: File downloaded successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '404':
          description: ScoreApiInfo or file type not found

  /workload/{id}:
    get:
      operationId: workloadIdGet
      tags:
        - workload
      summary: Retrieve a workload by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the workload to retrieve
      responses:
        '200':
          description: Workload retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadApiInfo'
        '404':
          description: Workload not found

  /author:
    post:
      operationId: authorPost
      tags:
        - author
      summary: Create a new author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorApiInfo'

      responses:
        '201':
          description: AuthorApiInfo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorApiInfo'
        '400':
          description: Invalid input
  /author/{mbid}:
    put:
      operationId: authorMbidPut
      tags:
        - author
      summary: Update an author
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
          description: The MusicBrainz ID for the author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorApiInfo'
      responses:
        '200':
          description: AuthorApiInfo retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorApiInfo'
        '404':
          description: AuthorApiInfo not found
    get:
      operationId: authorMbidGet
      tags:
        - author
      summary: Retrieve informations about an author
      parameters:
        - name: mbid
          in: path
          required: true
          schema:
            type: string
          description: The MusicBrainz ID for the author
      responses:
        '200':
          description: AuthorApiInfo retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorApiInfo'
        '404':
          description: AuthorApiInfo not found
  /author/search/{query}:
    get:
      operationId: authorSearchQueryGet
      tags:
        - author
      summary: Search authors
      parameters:
        - name: query
          in: path
          required: true
          schema:
            type: string
          description: The ID of the author
      responses:
        '200':
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorApiInfo'
        '404':
          description: AuthorApiInfo not found
  /score/author/browse:
    get:
      operationId: scoreAuthorBrowseGet
      tags:
        - score
      summary: Browse authors with their score counts
      parameters:
        - name: tracks
          in: query
          description: "List of track numbers to filter by (nullable). Examples: null, [1], [1,2]"
          schema:
            type: array
            items:
              type: integer
            nullable: true
          style: form
          explode: true
        - name: fullKey
          in: query
          schema:
            type: string
          description: 'Filter by musical full key (example: "D minor" or "D major")'
        - name: gradeStart
          in: query
          schema:
            type: string
        - name: gradeEnd
          in: query
          schema:
            type: string
        - name: slug
          in: query
          schema:
            type: string
          description: 'Filter by author slug to retrieve a specific author'
        - name: offset
          in: query
          schema:
            type: integer
          description: Result offset (default 0)
        - name: limit
          in: query
          schema:
            type: integer
          description: "Maximum number of results to return (default: all)"
      responses:
        '200':
          description: List of authors with score counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorWithScoreCount'
        '400':
          description: Bad request

  /score/genre/browse:
    get:
      operationId: scoreGenreBrowseGet
      tags:
        - score
      summary: Browse genres with their score counts
      parameters:
        - name: tracks
          in: query
          description: "List of track numbers to filter by (nullable). Examples: null, [1], [1,2]"
          schema:
            type: array
            items:
              type: integer
            nullable: true
          style: form
          explode: true
        - name: fullKey
          in: query
          schema:
            type: string
          description: 'Filter by musical full key (example: "D minor" or "D major")'
        - name: slug
          in: query
          schema:
            type: string
          description: 'Filter by genre slug to retrieve a specific genre'
        - name: genre
          in: query
          description: "List of genre UUIDs to filter by (nullable). Examples: null, [uuid1], [uuid1,uuid2]"
          schema:
            type: array
            items:
              type: string
              format: uuid
            nullable: true
          style: form
          explode: true
        - name: gradeStart
          in: query
          schema:
            type: string
        - name: gradeEnd
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
          description: Result offset (default 0)
        - name: limit
          in: query
          schema:
            type: integer
          description: "Maximum number of results to return (default: all)"
      responses:
        '200':
          description: List of genres with score counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    genre:
                      $ref: '#/components/schemas/GenreApiInfo'
                    count:
                      type: integer
                      format: int64
                    updatedAt:
                      type: string
                      format: date-time
                  required:
                    - count
                    - genre
                    - updatedAt
        '400':
          description: Bad request
  /genre:
    get:
      operationId: genreGet
      tags:
        - genre
      summary: Retrieve all genres
      responses:
        '200':
          description: A list of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreApiInfo'
    post:
      operationId: genrePost
      tags:
        - genre
      summary: Add a genre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreApiInfo'

      responses:
        '201':
          description: Genres created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreApiInfo'
  /genre/{id}:
    put:
      operationId: genreIdPut
      tags:
        - genre
      summary: Update a genre
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the genre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreApiInfo'
      responses:
        '200':
          description: Genre updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreApiInfo'
        '404':
          description: GenreApiInfo not found
    get:
      operationId: genreIdGet
      tags:
        - genre
      summary: Retrieve informations about a genre
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the genre
      responses:
        '200':
          description: Genre retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreApiInfo'
        '404':
          description: GenreApiInfo not found
  /genre/search/{query}:
    get:
      operationId: genreSearchQueryGet
      tags:
        - genre
      summary: Search genres
      parameters:
        - name: query
          in: path
          required: true
          schema:
            type: string
          description: The query to search genres
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreApiInfo'
        '404':
          description: Genre not found

  /genre_tree:
    get:
      tags:
        - genre_tree
      summary: Retrieve genre tree or subtree
      description: |
        Returns the full genre tree when called without parameters. Optionally accepts a
        query parameter `root_id` (UUID) to return the subtree rooted at that node.
      parameters:
        - name: root_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional UUID of the root node to return a subtree (if omitted returns full tree)
      responses:
        '200':
          description: Genre tree retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreTreeNode'
        '400':
          description: Bad request

  /genre_tree/{id}:
    put:
      tags:
        - genre_tree
      operationId: genreTreeIdPut
      summary: Create or update a genre tree node's parent
      description: |
        PUT is idempotent: if the node with the given `id` does not exist it may be created;
        otherwise its `parent_id` will be updated. The request body contains the `parent_id` (nullable) to set.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the genre tree node to create or update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreTreeUpdate'
      responses:
        '200':
          description: Node updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreTreeNode'
        '201':
          description: Node created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreTreeNode'
        '400':
          description: Bad request
        '404':
          description: Parent node not found (if parent_id is provided and does not exist)

  /artist/search/{query}:
    get:
      operationId: artistSearchQueryGet
      tags:
        - musicbrainz
      summary: Search all artists
      parameters:
        - name: query
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of artists retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MbAuthorApiInfo'
        '404':
          description: Artists not found

  /work/search/{query}:
    get:
      operationId: workSearchQueryGet
      tags:
        - musicbrainz
      summary: Search all works
      parameters:
        - name: query
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AuthorApiInfo retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllWorksApiInfo'
        '404':
          description: Work not found

  /account/grants:
    get:
      operationId: accountGrantsGet
      tags:
        - accountGrants
      summary: The user's access grants for external tools (coach, issue #414), newest first
      description: Never returns a token or its secret. Requires the cookie session.
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoachGrantApiInfo'
        '401':
          description: Not logged in
    post:
      operationId: accountGrantsPost
      tags:
        - accountGrants
      summary: Create an access grant and its token
      description: >
        The token is returned once, in this response only; the server keeps a hash of its secret. At most 5
        live (not revoked, not expired) grants per user, and 10 creations per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachGrantCreate'
      responses:
        '201':
          description: Grant created, with its token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachGrantCreated'
        '400':
          description: Invalid name, scopes or expiry
        '401':
          description: Not logged in
        '409':
          description: The user already has 5 live grants
        '429':
          description: Too many grants created in the last hour
  /account/grants/{id}:
    delete:
      operationId: accountGrantsIdDelete
      tags:
        - accountGrants
      summary: Revoke one of the user's grants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Grant revoked (also when it was already revoked)
        '401':
          description: Not logged in
        '404':
          description: No such grant for this user

  /coach/bridge/ticket:
    post:
      operationId: coachBridgeTicketPost
      tags:
        - coach
      summary: A one-time ticket to open the Remote coach WebSocket (issue #414)
      description: >
        Requires the cookie session and the CSRF header. The ticket is valid 30 seconds, once: the browser sends
        it in the first message of the WebSocket /coach/ws (never in the URL). 10 tickets per minute per user.
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachBridgeTicket'
        '401':
          description: Not logged in
        '429':
          description: Too many tickets in the last minute

  /coach/prompts:
    get:
      operationId: coachPromptsGet
      tags:
        - coach
      summary: Ready-made prompts that start the coach in any AI assistant (issue #414)
      description: >
        The same catalog as the MCP prompts of /mcp. Public: no user data. Each text is addressed to the
        assistant, in English; {name} placeholders stand for the arguments.
      responses:
        '200':
          description: Prompt catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoachPrompt'

  /practice/session/{id}:
    put:
      operationId: practiceSessionPut
      tags:
        - practice
      summary: Create or update one of the user's practice sessions
      description: >
        Idempotent: the client generates the id and sends the whole session again each time it changes
        (end of a take, checkpoint while playing, leaving the page). Requires authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeSessionApiInfo'
      responses:
        '200':
          description: The session as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSessionApiInfo'
        '400':
          description: Invalid or implausible session
        '401':
          description: Not logged in
        '403':
          description: The session belongs to another user

  /practice/sessions:
    get:
      operationId: practiceSessionsGet
      tags:
        - practice
      summary: The user's most recent practice sessions, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: kind
          in: query
          required: false
          description: score or exercise
          schema:
            type: string
        - name: scoreId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Practice sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PracticeSessionApiInfo'
        '401':
          description: Not logged in
    delete:
      operationId: practiceSessionsDelete
      tags:
        - practice
      summary: Delete the user's whole practice history
      responses:
        '204':
          description: History deleted
        '401':
          description: Not logged in

  /practice/summary:
    get:
      operationId: practiceSummaryGet
      tags:
        - practice
      summary: The user's practice progress, computed from the recorded sessions
      description: >
        Regularity (streak, practice days), volume, accuracy trend over the last 10 scores and exercises,
        statistics per key and per item (score or exercise) with weak measures, and level.
        Durations are in seconds; accuracy, flow and coverage are ratios between 0 and 1.
      parameters:
        - name: timeZone
          in: query
          required: false
          description: IANA time zone used for "today" (streak). Defaults to the zone of the latest session.
          schema:
            type: string
      responses:
        '200':
          description: Practice summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSummary'
        '401':
          description: Not logged in


components:
  schemas:
    AuthorApiInfo:
      type: object
      properties:
        id:
          type: string
        mbid:
          type: string
        name:
          type: string
        disambiguation:
          type: string
        country:
          type: string
        type:
          type: string
        gender:
          type: string
        lifeSpanBegin:
          type: string
          format: date
        lifeSpanEnd:
          type: string
          format: date
        lifeSpanEnded:
          type: boolean
        slug:
          type: string
          maxLength: 255
          description: URL-friendly slug for the author
        sortName:
          type: string
        description:
          type: string
          description: Description textuelle de l'auteur. Writable by ADMIN only; ignored for other users. Omitted leaves the stored value unchanged.
        composerBioLink:
          type: string
          format: uri
          description: Link to the composer's biography or external page. Writable by ADMIN only; ignored for other users. Omitted leaves the stored value unchanged.
        image:
          type: string
          maxLength: 255
          description: Author image URL (standard resolution). Writable by ADMIN only; ignored for other users. Omitted leaves the stored value unchanged.
        imageHq:
          type: string
          maxLength: 255
          description: Author image URL (high resolution). Writable by ADMIN only; ignored for other users. Omitted leaves the stored value unchanged.
    AuthorWithScoreCount:
      type: object
      properties:
        author:
          $ref: '#/components/schemas/AuthorApiInfo'
        count:
          type: integer
          format: int64
          description: Number of scores by this author
        updatedAt:
          type: string
          format: date-time
          description: Last update time for this author's score count
      required:
        - author
        - count
    ScoreReimportRequest:
      type: object
      required:
        - study_tracks
      properties:
        study_tracks:
          type: array
          description: Study tracks as indexes in the original MIDI file, right hand first (one or two).
          minItems: 1
          maxItems: 2
          items:
            type: integer
            minimum: 0
        make_fingering:
          type: boolean
          default: true
          description: Run automatic fingering detection when packing.
    ScoreApiInfo:
      type: object
      properties:
        id:
          type: string
        mbid:
          type: string
        title:
          type: string
        author:
          type: string
        author_id:
          type: string
        author_mbid:
          type: string
        author_slug:
          type: string
        sortName:
          type: string
        version:
          type: integer
          format: int32
        tracks_count:
          type: integer
          format: int32
        hand_separated:
          type: boolean
        has_lyrics:
          type: boolean
        measures:
          type: integer
          format: int32
        duration:
          type: number
          format: float
        genre:
          type: string
        genre_id:
          type: string
        genre_slug:
          type: string
        grade:
          type: number
          format: float
        uploaded_at:
          type: string
          format: date-time
        owner_id:
          type: string
        owner:
          type: string
        updated_at:
          type: string
          format: date-time
        has_files:
          type: boolean
        image:
          type: string
          format: uri
        study_tracks:
          type: array
          items:
            type: integer
        mutableSlug:
          type: string
        immutableSlug:
          type: string
        tempo:
          type: integer
          format: int32
        publicDomain:
          type: boolean
        exercise:
          type: boolean
        playCount:
          type: integer
          format: int64
        tonic:
          type: string
          maxLength: 10
          description: The tonic note of the piece (e.g., C, D, E)
        mode:
          type: string
          maxLength: 10
          description: The mode of the piece (e.g., major, minor)
        fullKey:
          type: string
          maxLength: 50
          description: The full key signature (e.g., C major, D minor)
        harmony:
          type: array
          nullable: true
          description: List of chord changes per measure and beat
          items:
            $ref: '#/components/schemas/HarmonyEntry'
        description:
          type: string
          description: Description textuelle de la partition
        youtubeLinks:
          type: array
          nullable: true
          description: List of YouTube links associated with the score
          items:
            $ref: '#/components/schemas/YoutubeLink'

    HarmonyEntry:
      type: object
      properties:
        measure:
          type: integer
          format: int32
          description: Measure number (1-based)
        root:
          type: string
          description: Root note of the chord (e.g., C, D, F#)
        kind:
          type: string
          description: Chord type (e.g., major, minor-seventh, dominant-seventh, diminished)
        beat:
          type: number
          format: float
          description: Beat position within the measure (1-based)
        bass:
          type: string
          nullable: true
          description: Optional bass note for slash chords (e.g., Bb)
      required:
        - measure
        - root
        - kind
        - beat

    YoutubeLink:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: YouTube URL
        rank:
          type: integer
          format: int32
          description: Ranking or priority for the link (lower is better)
      required:
        - url

    WorkloadApiInfo:
      type: object
      properties:
        id:
          type: integer
          format: int32
        kind:
          type: string
        createdAt:
          type: string
          format: date-time
        scoreId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        errorMessage:
          type: string
        duration:
          type: integer
          format: int32
          description: Duration in milliseconds
        workloadSize:
          type: integer
          format: int32
        makeFingerings:
          type: boolean
          description: Whether automatic fingering detection (pianoplayer) runs for this workload; passed to the *2pack.sh scripts.

    UserApiInfo:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        url:
          type: string
        bio:
          type: string
          format: uri
        image:
          type: string
          format: uri
        roles:
          type: string
          readOnly: true
          description: Comma-separated roles (e.g. "USER,ADMIN"). Read-only; ignored if sent in a request.
      required:
        - name
    GenreApiInfo:
      title: GenreApiInfo
      type: object
      properties:
        id:
          type: string
        mbid:
          type: string
        name:
          type: string
        scoreCount:
          type: integer
          format: int32
          readOnly: true
          description: Number of scores in this genre (computed). Read-only; ignored if sent in a request.
        slug:
          type: string
          maxLength: 255
          description: URL-friendly slug for the genre
        description:
          type: string
          description: Description textuelle du genre

    GenreTreeNode:
      type: object
      properties:
        mbid:
          type: string
          format: uuid
          description: MusicBrainz ID (MBID) of the genre (stored in genre_tree.genre_id)
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/GenreTreeNode'
      required:
        - mbid

    GenreTreeUpdate:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true
      required: []

    MusicBrainzService:
      type: object
      properties:
        name:
          type: string
        country:
          type: string
        disambiguation:
          type: string
        sort-name:
          type: string
        type:
          type: string
        life-span:
          type: object
          properties:
            begin:
              type: string
              format: date
            end:
              type: string
              format: date
            ended:
              type: boolean
    AllWorksApiInfo:
      type: object
      properties:
        works:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              relations:
                type: array
                items:
                  type: object
                  properties:
                    artist:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        sort-name:
                          type: string
                        disambiguation:
                          type: string
    MbAuthorApiInfo:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        sort-name:
          type: string
        disambiguation:
          type: string
        gender:
          type: string
        country:
          type:  string
        life-span:
          type: object
          properties:
            begin:
              type: string
              format: date
            end:
              type: string
              format: date
            ended:
              type: boolean
    YoutubeVideoApiInfo:
      type: object
      properties:
        videoId:
          type: string
          description: YouTube video ID
        title:
          type: string
          description: Video title
        description:
          type: string
          description: Video description snippet
        thumbnailUrl:
          type: string
          description: URL of the video thumbnail
        channelTitle:
          type: string
          description: Name of the YouTube channel
        publishedAt:
          type: string
          format: date-time
          description: Publication date of the video

    ErrorApiInfo:
      type: object
      properties:
        error:
          type: object
          properties:
            name:
              type: string
            message:
              type: string
            stacktrace:
              type: array
              items:
                type: string
    PracticeCounters:
      type: object
      description: Assessment counters. Notes are those of the hand(s) being practiced.
      properties:
        notesExpected:
          type: integer
          minimum: 0
          description: Notes the user was expected to play
        notesHit:
          type: integer
          minimum: 0
          description: Expected notes that were played
        notesWrong:
          type: integer
          minimum: 0
          description: Notes played that were not expected
        onsets:
          type: integer
          minimum: 0
          description: Expected note or chord onsets
        waits:
          type: integer
          minimum: 0
          description: Onsets completed late - playback had to wait for the user
    PracticeMeasure:
      allOf:
        - $ref: '#/components/schemas/PracticeCounters'
        - type: object
          properties:
            measure:
              type: integer
              minimum: 1
              description: Measure number (1-based, repeats unrolled)
          required:
            - measure
    PracticeTake:
      allOf:
        - $ref: '#/components/schemas/PracticeCounters'
        - type: object
          description: One Play to Stop (or end of the range). Each pass of a loop is a take.
          properties:
            startedAt:
              type: string
              format: date-time
            activeSeconds:
              type: integer
              minimum: 0
            measureStart:
              type: integer
            measureEnd:
              type: integer
            hands:
              type: string
              description: both, left, right or listen
            tempoFactor:
              type: number
              format: double
            completed:
              type: boolean
              description: The take reached the end of its range
    PracticeSessionApiInfo:
      allOf:
        - $ref: '#/components/schemas/PracticeCounters'
        - type: object
          description: All the takes on one score or exercise during one visit of the workbench.
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            kind:
              type: string
              enum: [score, exercise]
            scoreId:
              type: string
              format: uuid
              description: Required when kind is score
            slug:
              type: string
              readOnly: true
            title:
              type: string
              maxLength: 255
            author:
              type: string
              readOnly: true
            exerciseType:
              type: string
              description: scale or agility. Required when kind is exercise
            patternKey:
              type: string
              maxLength: 64
              description: Stable key of the scale or chord of an exercise
            exerciseKey:
              type: string
              maxLength: 64
              description: Stable key of the exercise pattern
            tonic:
              type: string
              maxLength: 10
            mode:
              type: string
              maxLength: 32
            grade:
              type: number
              format: float
              readOnly: true
            startedAt:
              type: string
              format: date-time
            endedAt:
              type: string
              format: date-time
            timeZone:
              type: string
              maxLength: 64
              description: IANA time zone of the user, to tell which calendar day was practiced
            localDate:
              type: string
              format: date
              readOnly: true
            activeSeconds:
              type: integer
              minimum: 0
              description: Time actually spent playing
            takeCount:
              type: integer
              minimum: 0
            completedCount:
              type: integer
              minimum: 0
              description: Takes that reached the end of their range
            measureStart:
              type: integer
            measureEnd:
              type: integer
            measureTotal:
              type: integer
            hands:
              type: string
              enum: [both, left, right, listen]
            tempoFactor:
              type: number
              format: double
            metronome:
              type: boolean
            loop:
              type: boolean
            input:
              type: string
              enum: [midi, none]
            accuracy:
              type: number
              format: double
              readOnly: true
              description: notesHit / (notesExpected + notesWrong); absent when nothing was assessed
            flow:
              type: number
              format: double
              readOnly: true
              description: 1 - waits / onsets; absent when nothing was assessed
            endReason:
              type: string
              enum: [ended, stopped, left, unloaded, idle]
            measures:
              type: array
              maxItems: 3000
              items:
                $ref: '#/components/schemas/PracticeMeasure'
            takes:
              type: array
              maxItems: 500
              items:
                $ref: '#/components/schemas/PracticeTake'
          required:
            - kind
            - startedAt
            - endedAt
            - activeSeconds
    PracticeDay:
      type: object
      properties:
        date:
          type: string
          format: date
        activeSeconds:
          type: integer
        sessions:
          type: integer
    PracticeRegularity:
      type: object
      properties:
        currentStreakDays:
          type: integer
          description: Consecutive practice days up to today (or yesterday if today is not practiced yet)
        longestStreakDays:
          type: integer
        practiceDays7:
          type: integer
        practiceDays30:
          type: integer
        practiceDays90:
          type: integer
        lastPracticeDate:
          type: string
          format: date
        averageSessionSeconds:
          type: integer
        daily:
          type: array
          description: The days with practice among the last 90
          items:
            $ref: '#/components/schemas/PracticeDay'
    PracticeVolume:
      type: object
      properties:
        activeSeconds:
          type: integer
          format: int64
        activeSeconds7:
          type: integer
          format: int64
        activeSeconds30:
          type: integer
          format: int64
        sessions:
          type: integer
        scores:
          type: integer
          description: Distinct scores played
        exercises:
          type: integer
          description: Distinct exercises played
    PracticeAccuracyWindow:
      type: object
      properties:
        sessions:
          type: integer
        accuracy:
          type: number
          format: double
        flow:
          type: number
          format: double
    PracticeAccuracyTrend:
      type: object
      properties:
        last10:
          $ref: '#/components/schemas/PracticeAccuracyWindow'
        previous10:
          $ref: '#/components/schemas/PracticeAccuracyWindow'
    PracticeKeyStats:
      type: object
      properties:
        tonic:
          type: string
        mode:
          type: string
        activeSeconds:
          type: integer
          format: int64
        sessions:
          type: integer
        accuracy:
          type: number
          format: double
        lastPlayedAt:
          type: string
          format: date-time
    PracticeWeakMeasure:
      type: object
      properties:
        measure:
          type: integer
        accuracy:
          type: number
          format: double
        notesExpected:
          type: integer
        waits:
          type: integer
    PracticeItemStats:
      type: object
      description: Progress on one score or one exercise
      properties:
        kind:
          type: string
        scoreId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        author:
          type: string
        exerciseType:
          type: string
        patternKey:
          type: string
        exerciseKey:
          type: string
        tonic:
          type: string
        mode:
          type: string
        grade:
          type: number
          format: float
        sessions:
          type: integer
        activeSeconds:
          type: integer
          format: int64
        firstPlayedAt:
          type: string
          format: date-time
        lastPlayedAt:
          type: string
          format: date-time
        bestAccuracy:
          type: number
          format: double
        lastAccuracy:
          type: number
          format: double
        bestTempoFactor:
          type: number
          format: double
          description: Fastest tempo factor of a complete take played with at least 90 % accuracy
        hands:
          type: array
          items:
            type: string
        playedHandsTogether:
          type: boolean
        completedCount:
          type: integer
          description: Takes that reached the end of their range
        measureTotal:
          type: integer
        measuresCovered:
          type: integer
        coverage:
          type: number
          format: double
        weakMeasures:
          type: array
          description: Measures with the lowest accuracy over the 5 latest sessions
          items:
            $ref: '#/components/schemas/PracticeWeakMeasure'
        stale:
          type: boolean
          description: Not played for 14 days while not mastered (never completed, or below 90 % accuracy)
    PracticeGradeCount:
      type: object
      properties:
        grade:
          type: integer
        scores:
          type: integer
    PracticeLevel:
      type: object
      properties:
        grades:
          type: array
          items:
            $ref: '#/components/schemas/PracticeGradeCount'
        highestGradeMastered:
          type: number
          format: float
          description: Highest grade completed hands together with at least 90 % accuracy
    PracticeSummary:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        timeZone:
          type: string
        regularity:
          $ref: '#/components/schemas/PracticeRegularity'
        volume:
          $ref: '#/components/schemas/PracticeVolume'
        scoreAccuracy:
          $ref: '#/components/schemas/PracticeAccuracyTrend'
        exerciseAccuracy:
          $ref: '#/components/schemas/PracticeAccuracyTrend'
        keys:
          type: array
          items:
            $ref: '#/components/schemas/PracticeKeyStats'
        items:
          type: array
          description: The 200 most recently played scores and exercises
          items:
            $ref: '#/components/schemas/PracticeItemStats'
        level:
          $ref: '#/components/schemas/PracticeLevel'
    CoachGrantScope:
      type: string
      enum: [practice:read, scores:read, player:control]
    CoachGrantApiInfo:
      type: object
      description: An access grant for an external tool. Never carries the token.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [pat, oauth]
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/CoachGrantScope'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - kind
        - scopes
        - createdAt
        - expiresAt
    CoachGrantCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Name of the tool, shown to the user when the tool acts
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CoachGrantScope'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
      required:
        - name
        - scopes
    CoachGrantCreated:
      allOf:
        - $ref: '#/components/schemas/CoachGrantApiInfo'
        - type: object
          properties:
            token:
              type: string
              description: The bearer token, pml_<grantId>_<secret>. Returned once; it cannot be read again.
          required:
            - token
    CoachPromptArgument:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        required:
          type: boolean
        default:
          type: string
          description: Value used when the argument is not given
      required:
        - name
        - required
    CoachPrompt:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/CoachPromptArgument'
        text:
          type: string
          description: The prompt, with {name} placeholders for the arguments
      required:
        - id
        - title
        - description
        - arguments
        - text
    CoachBridgeTicket:
      type: object
      properties:
        ticket:
          type: string
        expiresInSeconds:
          type: integer
      required:
        - ticket
        - expiresInSeconds
