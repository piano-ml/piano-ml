# TLS front for the frontend image under test, as https://pianoml.org (self-signed certificate): the browser
# reaches it through --host-resolver-rules (codecept.conf.js, SITE_ADDRESS), so the page has the production
# origin and the production API (api.pianoml.org) accepts its requests (CORS, cookies).
events {}

http {
  server {
    listen 443 ssl;
    server_name pianoml.org;
    ssl_certificate     /etc/nginx/certs/site.crt;
    ssl_certificate_key /etc/nginx/certs/site.key;

    location / {
      proxy_pass http://acceptance-frontend:4000;
      proxy_http_version 1.1;
      # The real host (an allowed SSR host); no X-Forwarded-* headers.
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }
  }
}
