@if (isOpen) {

<div class="modal" (click)="onBackdropClick($event)">
  <div class="modal-content" (click)="$event.stopPropagation()">


      <h2 class="card-secondary-title" i18n="@@scoreInfo.tempo">Tempo</h2>


      <div class="flex items-center justify-center gap-2  p-2">
        <button class="btn btn-desktop" (click)="decrease()">
          <ng-icon name="bootstrapDash" class="svg-button" />
        </button>
        <input type="number" min="20" max="200" class="w-24 text-center input-field" [value]="tempo"
          (input)="onNumberInput($any($event.target).value)"
          (change)="onNumberCommit($any($event.target))" />
        <button class="btn btn-desktop" (click)="increase()">
          <ng-icon name="bootstrapPlus" class="svg-button" />
        </button>
      </div>

      <div class="p-3">
        <input type="range" min="20" max="200" [value]="tempo" (input)="onRangeInput($any($event.target).value)"
          class="w-full accent-emerald-500" />
      </div>

      <div class="flex items-center gap-2 p-3">
        <input type="checkbox" id="metronome" [checked]="metronome" (change)="onMetronomeStatus($event.target.checked)" />
        <label for="metronome" i18n="@@tempo.metronome">Metronome</label>
      </div>

      <div class="flex items-center gap-2 p-3">
        <label for="count-in" i18n="@@tempo.countIn">Count-in (bars)</label>
        <input type="number" id="count-in" min="0" [max]="countInMax" step="1" class="w-20 text-center input-field"
          [value]="countIn" (change)="onCountInChange($any($event.target))" data-count-in />
      </div>

    <div class="flex justify-end mt-4">
      <button (click)="close()" class="btn-secondary" i18n="@@common.close">Close</button>
    </div>
  </div>
</div>
}
