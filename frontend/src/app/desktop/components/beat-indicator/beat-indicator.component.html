@let b = beat();
<div class="beat-indicator" [class.beat-downbeat]="b.beat === 1" [style.--beat-duration]="b.beatSeconds + 's'"
  role="img" [attr.aria-label]="ariaLabel()">
  <svg class="beat-ring" viewBox="0 0 100 100" aria-hidden="true">
    @for (segment of segments(); track segment.index) {
    <circle class="beat-track" cx="50" cy="50" r="44" pathLength="100"
      [attr.stroke-dasharray]="segment.length + ' 100'" [attr.transform]="'rotate(' + segment.rotate + ' 50 50)'" />
    @if (segment.state === 'past') {
    <circle class="beat-fill" [class.beat-fill-downbeat]="segment.index === 0" cx="50" cy="50" r="44"
      pathLength="100" [attr.stroke-dasharray]="segment.length + ' 100'"
      [attr.transform]="'rotate(' + segment.rotate + ' 50 50)'" />
    }
    @if (segment.state === 'current') {
    <!-- Keyed by the click: a new beat starts a new fill, even on the same number -->
    @for (seq of [b.seq]; track seq) {
    <circle class="beat-fill beat-filling" [class.beat-fill-downbeat]="segment.index === 0" cx="50" cy="50" r="44"
      pathLength="100" [style.--beat-length]="segment.length"
      [attr.transform]="'rotate(' + segment.rotate + ' 50 50)'" />
    }
    }
    }
  </svg>

  <div class="beat-center">
    <div class="beat-phase" i18n="@@beat.countIn">Count-in</div>
    @for (seq of [b.seq]; track seq) {
    <div class="beat-number">{{ b.beat }}</div>
    }
    <div class="beat-meta">
      @if (bpm(); as tempo) {
      <span class="beat-bpm">♩ {{ tempo }}</span>
      }
      <span>{{ b.timeSignature[0] }}/{{ b.timeSignature[1] }}</span>
      @if (b.countInBars > 1) {
      <span><ng-container i18n="@@beat.bar">Bar</ng-container> {{ b.countInBar }}/{{ b.countInBars }}</span>
      }
    </div>
  </div>
</div>
