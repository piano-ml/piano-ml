@if (!loadingScores && popularScores.length > 0) {
  <section class="popular-scores-section" aria-label="Popular works in this key">

    <div class="popular-scores-header">
      <span class="popular-scores-label">Popular works in this key</span>
      <a [href]="getLibraryUrl()" class="popular-scores-view-all">View all →</a>
    </div>

    <div class="popular-scores-list">
      @for (score of popularScores; track score) {
        <a [href]="getScoreUrl(score)" class="popular-score-pill">
          <span class="popular-score-title">{{ score.title }}</span>
          @if (score.author) {
            <span class="popular-score-author">{{ score.author }}</span>
          }
        </a>
      }
    </div>

  </section>
}
