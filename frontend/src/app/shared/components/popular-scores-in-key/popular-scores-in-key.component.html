<div *ngIf="!loadingScores && popularScores.length > 0" class="mt-6">


  <div class="bg-neutral-700 rounded p-4 text-sm">
  <div class="flex items-center gap-2 mb-3">
    <span class="text-neutral-300 font-semibold">Popular works in this scale:</span>
    <a [href]="getLibraryUrl()" class="text-blue-300 hover:text-blue-200 text-sm underline">
      View all
    </a>
  </div>
    <span *ngFor="let score of popularScores; let last = last">
      <a [href]="getScoreUrl(score)" class="text-blue-300 hover:text-blue-200 hover:underline">
        <span class="font-semibold">{{ score.title }}</span>
        <span *ngIf="score.author" class="text-neutral-400"> ({{ score.author }})</span></a><span *ngIf="!last" class="text-neutral-400">, </span>
    </span>
  </div>
</div>
