<div class="overflow-x-auto" *ngIf="scores.length > 0 || loading">
  <table [class]="tableClass">
    <thead>
      <tr class="bg-neutral-600">
        <th *ngFor="let column of getVisibleColumns()" 
            class="border border-gray-300 px-4 py-2 text-left">
          {{ column.label }}
        </th>
        <th *ngIf="actions.length > 0" 
            class="border border-gray-300 px-4 py-2 text-center">
          Actions
        </th>
      </tr>
    </thead>
    <tbody>
      <!-- Score rows -->
      <tr *ngFor="let score of scores" 
          [class]="showRowClick ? rowClass : 'hover:bg-gray-600 transition-colors'"
          (click)="onRowClick(score)">
        <td *ngFor="let column of getVisibleColumns()" 
            class="border border-gray-300 px-4 py-2">
          <div class="font-medium">{{ getCellValue(score, column) }}</div>
        </td>
        <td *ngIf="actions.length > 0" 
            class="border border-gray-300 px-4 py-2 text-center">
          <div class="flex gap-1 justify-center">
            <button *ngFor="let action of actions"
                    (click)="onActionClick(action, score, $event); $event.stopPropagation()"
                    [class]="getButtonClass(action)"
                    [title]="action.label">
              <span *ngIf="action.icon">{{ action.icon }}</span>
              <span *ngIf="!action.icon">{{ action.label }}</span>
            </button>
          </div>
        </td>
      </tr>

      <!-- Loading state -->
      <tr *ngIf="loading">
        <td [attr.colspan]="getVisibleColumns().length + (actions.length > 0 ? 1 : 0)" 
            class="border border-gray-300 px-4 py-2 text-center text-gray-400">
          <div class="py-4">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-500 mx-auto mb-2"></div>
            {{ loadingMessage }}
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Empty state -->
<div *ngIf="scores.length === 0 && !loading" 
     class="text-center text-gray-400 py-8 bg-neutral-600 rounded-lg">
  <div class="text-2xl mb-2">🎵</div>
  <p>{{ emptyMessage }}</p>
  <p class="text-sm mt-1">Try adjusting your search criteria.</p>
</div>
