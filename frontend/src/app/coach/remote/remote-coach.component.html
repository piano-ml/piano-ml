@if (isBrowser && coach.audioLocked()) {
  <button type="button" class="btn-success shadow-lg fixed bottom-4 right-4 z-50" data-testid="remote-coach-start-playback"
    (click)="coach.startPlayback()" i18n="@@coach.remote.startPlayback">Start playback</button>
}

@if (coach.confirming()) {
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="remote-coach-title" data-testid="remote-coach-confirm">
    <div class="modal-content">
      <h3 id="remote-coach-title" class="page-sub-title mb-4" i18n="@@coach.remote.confirm.title">Turn on Remote coach?</h3>
      <p class="text-sm text-neutral-400 mb-6" i18n="@@coach.remote.confirm.text">External tools you gave access to will be able to open scores and start or stop the player in this tab until you turn this off or close the tab.</p>
      <div class="flex justify-end gap-3">
        <button type="button" class="btn-secondary" data-testid="remote-coach-dismiss" (click)="coach.dismiss()" i18n="@@coach.grants.cancel">Cancel</button>
        <button type="button" class="btn-primary" data-testid="remote-coach-confirm-yes" (click)="coach.confirm()" i18n="@@coach.remote.confirm.yes">Turn on</button>
      </div>
    </div>
  </div>
}
