<div class=" bg-neutral-700 p-4">
  <table class="table-auto border-collapse border border-gray-400 w-full">
    <thead>
      <tr>


        <th class="border border-gray-300 px-4 py-2" i18n="@@builtin.name">Name</th>
        <th class="border border-gray-300 px-4 py-2" i18n="@@scoreTable.artist">Artist</th>
        <th class="border border-gray-300 px-4 py-2" i18n="@@builtin.description">Description</th>
        <th class="border border-gray-300 px-4 py-2" i18n="@@scoreTable.difficulty">Difficulty</th>
      </tr>
    </thead>
    <tbody>
      @for (song of manifest; track song) {
        <tr (click)="onSongClick(song)">
          <td class="border border-gray-300 px-4 py-2">{{ song.name }}</td>
          <td class="border border-gray-300 px-4 py-2">{{ song.artist }}</td>
          <td class="border border-gray-300 px-4 py-2">{{ songDescription(song.filename, song.description) }}</td>
          <td class="border border-gray-300 px-4 py-2">{{ difficultyLabel(song.difficulty) }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
