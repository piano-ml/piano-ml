<div class="carousel-wrap">
  <div class="carousel-head">
    <p class="section-label" i18n="@@videos.heading">Video lessons</p>
    <div class="carousel-controls">
      <button
        class="btn-secondary carousel-btn"
        type="button"
        (click)="scrollLeft()"
        [disabled]="!canScrollLeft"
        i18n-aria-label="@@videos.scrollLeft" aria-label="Scroll left">
        ←
      </button>
      <button
        class="btn-secondary carousel-btn"
        type="button"
        (click)="scrollRight()"
        [disabled]="!canScrollRight"
        i18n-aria-label="@@videos.scrollRight" aria-label="Scroll right">
        →
      </button>
    </div>
  </div>

  <div class="carousel-track" #track (scroll)="onTrackScroll()">
    @for (video of videos; track video.videoId) {
    <div class="carousel-item">
      <app-video-carousel-item [video]="video" (selectVideo)="onVideoSelect($event)"></app-video-carousel-item>
    </div>
    }
  </div>
</div>
