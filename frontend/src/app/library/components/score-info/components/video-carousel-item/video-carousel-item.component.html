<button class="video-card" (click)="onSelect()" type="button" [attr.aria-label]="playLabel()">
  <div class="video-thumb-wrap">
    <img
      class="video-thumb"
      [src]="video.thumbnailUrl || ''"
      [alt]="video.title || thumbnailAlt"
      loading="lazy">
    <div class="play-overlay" aria-hidden="true">
      <span class="play-icon">▶</span>
    </div>
  </div>

  <div class="video-meta">
    <h4 class="video-title">@if (video.title) { {{ video.title }} } @else { <ng-container i18n="@@videos.untitled">Untitled video</ng-container> }</h4>
    @if (video.channelTitle) {
    <p class="video-channel">{{ video.channelTitle }}</p>
    }
    @if (video.publishedAt) {
    <p class="video-date">{{ video.publishedAt | date:'mediumDate' }}</p>
    }
  </div>
</button>
