<div class="mb-6 rounded-lg p-4">
  <!-- <h2 class="text-xl font-semibold text-white mb-4">Browse by Genre</h2> -->

  <!-- No loading indicator here: the score table below loads last and shows the page's single spinner -->
  @if (!loadingGenres && genres.length > 0) {
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
      @for (genre of genres; track genre) {
        <button
          (click)="onGenreClick(genre)"
          class="capsule">
          <div class="font-medium text-sm truncate group-hover:text-emerald-100">
            @if (genre.genre.name) { {{ genre.genre.name }} } @else { <ng-container i18n="@@browse.genreNotSpecified">genre not specified</ng-container> }
          </div>
          <div class="text-xs text-gray-300 mt-1" i18n="@@browse.capsuleCount">{genre.count, plural, =1 {1 score} other {{{ genre.count }} scores}}</div>
        </button>
      }
    </div>
  }
</div>
