<div class="px-6 pt-2 pb-0">
  <div class="page-title">Agility</div>
  <div class="page-sub-title">Please select an exercise and a chord</div>
  <hr>
    <div class="flex flex-col md:flex-row gap-6">

      <div class="md:w-1/2 flex flex-col gap-3">
        <select [(ngModel)]="selectedKey" (ngModelChange)="onKeyChange()" class="input-field">
          @for (key of keys; track key) {
            <option [ngValue]="key">{{ key }}</option>
          }
        </select>

        <select [(ngModel)]="selectedChord" (ngModelChange)="onChordChange()" class="input-field">
          @for (chord of this.availableChords; track chord) {
            <option [ngValue]="chord">{{ selectedKey }} {{ chord.name }}</option>
          }
        </select>

        <select [(ngModel)]="selectedExcercice" (ngModelChange)="onSelectedExerciceChange()" class="input-field">
          @for (exercise of myexcerices; track exercise) {
            <option [ngValue]="exercise">{{ exercise.title }}</option>
          }
        </select>
      </div>

      <div class="md:w-1/2">
        <button (click)="load()"
          class="btn-hero w-full mt-4 mb-4">
          🔥 Start
        </button>

        <div class="bg-neutral-700 rounded p-4 text-sm text-neutral-100 whitespace-pre-wrap">
          <div class="font-semibold mb-2">{{ selectedKey }} {{ selectedChord.name }} {{ selectedExcercice.title }}</div>
          {{ selectedExcercice.advice || 'No description available.' }}
        </div>

      </div>

    </div>

    @for (_ of [componentKey]; track _) {
      <app-popular-scores-in-key
        [fullKey]="fullKey"
        [limit]="10">
      </app-popular-scores-in-key>
    }

  </div>
