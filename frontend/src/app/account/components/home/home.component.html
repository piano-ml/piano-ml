<div class="px-6 pt-2 pb-0">
    <div class="page-title">Account</div>
    <hr>
    
    <div class="bg-neutral-700 p-4 rounded mb-6">
      <div class="grid grid-cols-1 gap-6">
        <!-- Name Field -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-300 mb-2">
            Name <span class="text-red-400">*</span>
          </label>
          <div *ngIf="!editMode" class="flex items-center justify-between">
            <div class="w-full px-3 py-2 border rounded-lg bg-gray-100 text-gray-700">
              {{ userInfo.name || 'No name set' }}
            </div>
            <button 
              type="button"
              (click)="enableEdit()" 
              class="ml-2 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
              title="Edit name">
              Edit
            </button>
          </div>
          <div *ngIf="editMode">
            <form [formGroup]="nameForm" (ngSubmit)="savename()" class="space-y-4">
              <input
                type="text"
                id="name"
                formControlName="name" 
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:border-blue-300 text-black"
                placeholder="Enter your name">
              
              <!-- Action Buttons -->
              <div class="flex gap-4">
                <button 
                  type="submit" 
                  class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
                  title="Save">
                  Save
                </button>
                <button 
                  type="button"
                  (click)="editMode = false"
                  class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <ul class="ml-2">
      <li class="mb-4 mt-4">
        <a routerLink="/account/scores" class="text-xl mb-4 mt-4">My Scores</a>
      </li>
      <li class="mb-4 mt-4">
        <button (click)="logout()" class="text-xl mb-4 mt-4 text-red-500 hover:text-red-700 bg-transparent border-none cursor-pointer">
          Logout
        </button>
      </li>
    </ul>
</div>
