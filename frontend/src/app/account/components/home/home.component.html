<article class="main-article">

  <div class="px-4 sm:px-6 pt-4">
    <div class="page-title" i18n="@@accountHome.profile">Profile</div>
    <div class="page-sub-title" i18n="@@accountHome.subtitle">Your playlists, scores, practice, AI access and account</div>
  </div>

  <!-- ── Tabs: one child route each; scrolls on its own on phones rather than widening the page ── -->
  <nav class="px-4 sm:px-6" i18n-aria-label="@@accountHome.tabs.label" aria-label="Account sections">
    <div class="flex overflow-x-auto">
      @for (tab of tabs; track tab.path) {
        <a [routerLink]="tab.path" routerLinkActive="border-emerald-500 text-white" #rla="routerLinkActive"
          [class.text-gray-300]="!rla.isActive" [attr.data-testid]="'tab-' + tab.path"
          class="shrink-0 whitespace-nowrap px-3 sm:px-6 py-3 font-medium border-b-2 transition-colors duration-200 hover:text-white focus:outline-none">
          {{ tab.label }}
        </a>
      }
    </div>
  </nav>

  <div class="px-4 sm:px-6 pb-12 mt-6">
    <router-outlet />
  </div>

</article>
