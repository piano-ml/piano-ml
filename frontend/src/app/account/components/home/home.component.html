<article class="main-article">

  <div class="px-4 sm:px-6 pt-4">
    <div class="page-title" i18n="@@accountHome.profile">Profile</div>
    <div class="page-sub-title" i18n="@@accountHome.subtitle">Your playlists, scores, practice, AI access and account</div>
  </div>

  <!-- ── Tabs: one child route each; on phones the bar scrolls sideways and keeps the open tab in view ── -->
  <nav class="px-4 sm:px-6" i18n-aria-label="@@accountHome.tabs.label" aria-label="Account sections">
    <div class="tab-bar">
      @for (tab of tabs; track tab.path) {
        <a class="tab-link" [routerLink]="tab.path" routerLinkActive="tab-link-active" ariaCurrentWhenActive="page"
          #rla="routerLinkActive" [appKeepInView]="rla.isActive" [attr.data-testid]="'tab-' + tab.path">{{ tab.label }}</a>
      }
    </div>
  </nav>

  <div class="px-4 sm:px-6 pb-12 mt-6">
    <router-outlet />
  </div>

</article>
