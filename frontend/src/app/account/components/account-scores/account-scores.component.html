<article class="main-article">

  <div class="px-4 sm:px-6 pt-4">
    <div class="page-title">My Scores</div>
    <div class="page-sub-title">Your uploaded and curated collection</div>
  </div>

  <hr class="mx-4 sm:mx-6">

  <div class="px-4 sm:px-6 pb-12 flex flex-col gap-5">

    <!-- ── Toolbar ────────────────────────────────────────── -->
    <div class="flex items-center justify-between gap-4">
      <p class="page-sub-title">
        @if (!loading && scores.length > 0) {
          {{ scores.length }} score{{ scores.length !== 1 ? 's' : '' }}
        }
      </p>
      <div class="flex items-center gap-3">
        <app-quick-actions></app-quick-actions>
        <button (click)="navigateToOpen()" class="btn-primary" [disabled]="loading">
          Browse library
        </button>
      </div>
    </div>

    <!-- ── Error ──────────────────────────────────────────── -->
    @if (error && !loading) {
      <div class="alert-error">
        <strong>Error:</strong> {{ error }}
      </div>
    }

    <!-- ── Scores table ───────────────────────────────────── -->
    @if (!error) {
      <app-score-table
        [scores]="scores"
        [loading]="loading"
        [columns]="tableColumns"
        [actions]="tableActions"
        [showRowClick]="true"
        (scoreClick)="onScoreClick($event)"
        emptyMessage="No scores yet — upload your first MIDI file to get started."
        loadingMessage="Loading your scores…"
        rowClass="">
      </app-score-table>
    }

  </div>

</article>
