<div *ngIf="loading" class="text-center">Loading artists...</div>
<div *ngIf="!loading && authors.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  <div *ngFor="let author of authors" (click)="onAuthorClick(author)" class="cursor-pointer p-4 bg-neutral-800 rounded-lg hover:bg-neutral-700 transition-colors">
    <h3 class="text-lg font-semibold text-blue-400">{{ author.author.name }}</h3>
    <p class="text-gray-400">{{ author.count }} scores</p>
  </div>
</div>
