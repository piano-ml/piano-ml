<div class="mb-6 bg-neutral-800 rounded-lg p-4">
  <!-- <h2 class="text-xl font-semibold text-white mb-4">Browse by Artist</h2> -->
  
  <div *ngIf="loadingAuthors" class="text-gray-400 text-center py-4">
    Loading artists...
  </div>
  
  <div *ngIf="!loadingAuthors && authors.length > 0" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
    <button 
      *ngFor="let author of authors"
      (click)="onAuthorClick(author)"
      class="bg-neutral-700 hover:bg-blue-600 text-white rounded-lg p-3 transition-colors duration-200 text-left group">
      <div class="font-medium text-sm truncate group-hover:text-blue-100">
        {{ author.author.name }}
      </div>
      <div class="text-xs text-gray-400 mt-1">
        {{ author.count }} {{ author.count === 1 ? 'score' : 'scores' }}
      </div>
    </button>
  </div>
</div>
