<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f1f1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#backgroundGradient)"/>
  
  <!-- Central help circle -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#777" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#888" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="32" fill="url(#centerGradient)" stroke="#999" stroke-width="1"/>
    
    <!-- Question mark -->
    <g fill="#555" transform="scale(1.2)">
      <!-- Question mark curve -->
      <path d="M-8 -12 Q-8 -18 -2 -18 Q4 -18 4 -12 Q4 -8 0 -6 L0 -2" 
            stroke="#555" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Question mark dot -->
      <circle cx="0" cy="4" r="2.5"/>
    </g>
  </g>
  
  <!-- Information nodes around -->
  <g opacity="0.7">
    <!-- Top info node -->
    <g transform="translate(100, 35)">
      <circle cx="0" cy="0" r="8" fill="#666" stroke="#888" stroke-width="1"/>
      <text x="0" y="2" text-anchor="middle" fill="#ddd" font-family="Arial, sans-serif" font-size="10" font-weight="bold">i</text>
    </g>
    
    <!-- Right info node -->
    <g transform="translate(165, 100)">
      <circle cx="0" cy="0" r="8" fill="#666" stroke="#888" stroke-width="1"/>
      <text x="0" y="2" text-anchor="middle" fill="#ddd" font-family="Arial, sans-serif" font-size="10" font-weight="bold">?</text>
    </g>
    
    <!-- Bottom info node -->
    <g transform="translate(100, 165)">
      <circle cx="0" cy="0" r="8" fill="#666" stroke="#888" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" fill="#ddd" font-family="Arial, sans-serif" font-size="8" font-weight="bold">!</text>
    </g>
    
    <!-- Left info node -->
    <g transform="translate(35, 100)">
      <circle cx="0" cy="0" r="8" fill="#666" stroke="#888" stroke-width="1"/>
      <text x="0" y="2" text-anchor="middle" fill="#ddd" font-family="Arial, sans-serif" font-size="10" font-weight="bold">?</text>
    </g>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#777" stroke-width="1" opacity="0.4" stroke-dasharray="3,3">
    <line x1="100" y1="55" x2="100" y2="68"/>
    <line x1="145" y1="100" x2="132" y2="100"/>
    <line x1="100" y1="145" x2="100" y2="132"/>
    <line x1="55" y1="100" x2="68" y2="100"/>
  </g>
  
  <!-- Document pages in background -->
  <g transform="translate(40, 40)" opacity="0.3">
    <!-- Page 1 -->
    <rect x="0" y="0" width="30" height="40" fill="#ddd" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <g stroke="#999" stroke-width="0.5">
      <line x1="3" y1="6" x2="27" y2="6"/>
      <line x1="3" y1="10" x2="27" y2="10"/>
      <line x1="3" y1="14" x2="20" y2="14"/>
      <line x1="3" y1="18" x2="25" y2="18"/>
    </g>
    
    <!-- Page 2 -->
    <rect x="5" y="5" width="30" height="40" fill="#e8e8e8" stroke="#ccc" stroke-width="0.5" rx="2"/>
    <g stroke="#aaa" stroke-width="0.5">
      <line x1="8" y1="11" x2="32" y2="11"/>
      <line x1="8" y1="15" x2="32" y2="15"/>
      <line x1="8" y1="19" x2="25" y2="19"/>
    </g>
  </g>
  
  <!-- Light bulb icon -->
  <g transform="translate(150, 50)" opacity="0.5">
    <!-- Bulb -->
    <circle cx="0" cy="0" r="6" fill="none" stroke="#888" stroke-width="1.5"/>
    <!-- Base -->
    <rect x="-3" y="6" width="6" height="4" fill="none" stroke="#888" stroke-width="1"/>
    <!-- Light rays -->
    <g stroke="#888" stroke-width="1" opacity="0.6">
      <line x1="-10" y1="-10" x2="-12" y2="-12"/>
      <line x1="10" y1="-10" x2="12" y2="-12"/>
      <line x1="-10" y1="10" x2="-12" y2="12"/>
      <line x1="10" y1="10" x2="12" y2="12"/>
      <line x1="0" y1="-12" x2="0" y2="-15"/>
      <line x1="-12" y1="0" x2="-15" y2="0"/>
      <line x1="12" y1="0" x2="15" y2="0"/>
    </g>
  </g>
  
  <!-- Floating elements -->
  <g opacity="0.3">
    <!-- Gear -->
    <g transform="translate(50, 150)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#777" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#777" stroke-width="1"/>
      <!-- Gear teeth -->
      <g stroke="#777" stroke-width="1">
        <line x1="0" y1="-10" x2="0" y2="-12"/>
        <line x1="7" y1="-7" x2="8.5" y2="-8.5"/>
        <line x1="7" y1="7" x2="8.5" y2="8.5"/>
        <line x1="0" y1="10" x2="0" y2="12"/>
        <line x1="-7" y1="7" x2="-8.5" y2="8.5"/>
        <line x1="-7" y1="-7" x2="-8.5" y2="-8.5"/>
      </g>
    </g>
  </g>
  
  <!-- Ambient glow -->
  <g filter="url(#glow)" opacity="0.1">
    <circle cx="100" cy="100" r="60" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  
  <!-- Title -->
  <text x="100" y="190" text-anchor="middle" fill="#ccc" font-family="Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="1px">HELP</text>
</svg>