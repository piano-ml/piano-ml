name: Post-release sync

# Runs on every push to main, not only on merged release PRs: hotfix PRs
# merged straight into main (e.g. #335) must flow back to develop too,
# otherwise develop drifts and the next promotion re-diffs them.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-release-sync
  cancel-in-progress: false

jobs:
  sync-develop:
    name: Sync develop with main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync develop with main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main develop

          # If main is already ancestor of develop, nothing to do
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains all commits from main. Nothing to sync."
            exit 0
          fi

          # Merge main back into develop. The "chore: sync" subject prefix is
          # relied on by release-promotion.yaml to skip these in the changelog.
          git checkout -B develop origin/develop
          if ! git merge --no-edit origin/main -m "chore: sync develop with main"; then
            git merge --abort || true
            echo "::error::Merging main into develop conflicts; sync it manually."
            exit 1
          fi

          # Note: a push made with GITHUB_TOKEN does not trigger other
          # workflows, and fails if develop requires PRs via branch protection.
          git push origin develop
