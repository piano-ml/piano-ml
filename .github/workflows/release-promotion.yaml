name: Release promotion

on:
  workflow_run:
    workflows: ["tests"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to promote
        required: true
        type: string
        default: develop
      target_branch:
        description: Target branch
        required: true
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-promotion-${{ github.event.workflow_run.head_branch || github.event.inputs.source_branch || 'develop' }}-to-${{ github.event.inputs.target_branch || 'main' }}
  cancel-in-progress: false

env:
  DEFAULT_SOURCE_BRANCH: develop
  DEFAULT_TARGET_BRANCH: main

jobs:
  prepare:
    name: Prepare promotion
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      source_branch: ${{ steps.branches.outputs.source_branch }}
      target_branch: ${{ steps.branches.outputs.target_branch }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
      source_sha: ${{ steps.fetch.outputs.source_sha }}
    steps:
      - name: Resolve branches
        id: branches
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          INPUT_TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_BRANCH="$INPUT_SOURCE_BRANCH"
            TARGET_BRANCH="$INPUT_TARGET_BRANCH"
          else
            SOURCE_BRANCH="$WORKFLOW_RUN_BRANCH"
            TARGET_BRANCH="$DEFAULT_TARGET_BRANCH"
          fi

          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches
        id: fetch
        env:
          SOURCE_BRANCH: ${{ steps.branches.outputs.source_branch }}
          TARGET_BRANCH: ${{ steps.branches.outputs.target_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_BRANCH" "$TARGET_BRANCH"
          echo "source_sha=$(git rev-parse "origin/$SOURCE_BRANCH")" >> "$GITHUB_OUTPUT"

      - name: Check merge conflicts
        env:
          SOURCE_BRANCH: ${{ steps.branches.outputs.source_branch }}
          TARGET_BRANCH: ${{ steps.branches.outputs.target_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          if git merge --no-commit --no-ff "origin/$SOURCE_BRANCH"; then
            if [[ -f .git/MERGE_HEAD ]]; then
              git merge --abort
            fi
          else
            if [[ -f .git/MERGE_HEAD ]]; then
              git merge --abort
            fi
            echo "Merging $SOURCE_BRANCH into $TARGET_BRANCH currently has conflicts or cannot be prepared automatically." >&2
            exit 1
          fi

      - name: Find existing promotion PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ steps.branches.outputs.source_branch }}
          TARGET_BRANCH: ${{ steps.branches.outputs.target_branch }}
        run: |
          set -euo pipefail

          PR_JSON=$(gh pr list \
            --repo "$REPO" \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --state open \
            --json number,url \
            --limit 1)

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number // empty')
          PR_URL=$(echo "$PR_JSON" | jq -r '.[0].url // empty')

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

  sync_pr:
    name: Sync promotion PR
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          TITLE="Release: promote $SOURCE_BRANCH to $TARGET_BRANCH"
          BODY=$(cat <<EOF
          Automated promotion PR.

          - Source: \
            \
            $SOURCE_BRANCH
          - Target: \
            \
            $TARGET_BRANCH
          - Source SHA: \
            \
            $SOURCE_SHA

          Safeguards:
          - opened only after a successful push workflow on $SOURCE_BRANCH or via manual dispatch
          - merge-conflict check passed before creating/updating this PR
          - workflow concurrency prevents overlapping promotions for the same branch pair
          - merge is intentionally manual
          EOF
          )

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --title "$TITLE" --body "$BODY"
            echo "Promotion PR already exists: #$PR_NUMBER"
          else
            gh pr create \
              --repo "$REPO" \
              --base "$TARGET_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --title "$TITLE" \
              --body "$BODY"

            PR_NUMBER=$(gh pr list \
              --repo "$REPO" \
              --base "$TARGET_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --state open \
              --json number \
              --limit 1 \
              --jq '.[0].number')
          fi
