name: Build and Push to GHCR

on:
  push:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/pianoml
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/pianoml-fe
  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/test.yaml

  backend:
    needs: tests
    name: Backend - Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ env.BRANCH_NAME }}
          cache-from: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache,mode=max

  frontend:
    needs: tests
    name: Frontend - Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ env.BRANCH_NAME }}
          cache-from: type=registry,ref=${{ env.IMAGE_FRONTEND }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_FRONTEND }}:cache,mode=max

      - name: Smoke test image
        run: |
          docker pull ${{ env.IMAGE_FRONTEND }}:${{ env.BRANCH_NAME }}
          docker run -d --rm --name fe-smoke -p 8080:4000 ${{ env.IMAGE_FRONTEND }}:${{ env.BRANCH_NAME }}
          for i in {1..10}; do curl -fsS http://localhost:8080/ && break; sleep 3; done
          docker logs fe-smoke
          docker stop fe-smoke
