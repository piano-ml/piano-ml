name: Build and Push to GHCR

on:
  push:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/pianoml
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/pianoml-fe
  BRANCH_NAME: ${{ github.ref_name }}

# A newer push to the same branch supersedes an in-flight build, so an older
# run can never finish last and leave :main/:develop pointing at stale code.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/test.yaml
    # test.yaml asks for pull-requests: write (PR coverage comments); a called
    # workflow cannot get more than its caller grants. Unused on push.
    permissions:
      contents: read
      pull-requests: write

  coverage-badges:
    needs: tests
    name: Publish coverage badges
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    # develop and main both push to the badges branch: never run two at once.
    concurrency:
      group: coverage-badges
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download coverage summaries
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*-${{ github.sha }}
          path: coverage
          merge-multiple: true

      - name: Build badges
        run: |
          mkdir -p out
          be=$(node .github/scripts/coverage-badge.mjs --jacoco coverage/jacoco.xml --label "backend coverage" --out out/backend.svg)
          fe=$(node .github/scripts/coverage-badge.mjs --vitest coverage/coverage-summary.json --label "frontend coverage" --out out/frontend.svg)
          {
            echo "### Coverage (${BRANCH_NAME})"
            echo "| | Lines |"
            echo "|---|---|"
            echo "| Backend | ${be} |"
            echo "| Frontend | ${fe} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Badges live on an orphan "badges" branch (<branch>/backend.svg, <branch>/frontend.svg),
      # so CI never commits to develop/main. README points at raw.githubusercontent.com.
      - name: Push badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badges && cd badges
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin badges; then
            git checkout -q -b badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          mkdir -p "${BRANCH_NAME}"
          cp ../out/*.svg "${BRANCH_NAME}/"
          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged"
            exit 0
          fi
          git commit -q -m "coverage badges for ${BRANCH_NAME} @ ${GITHUB_SHA::7}"
          git push -q origin badges

  backend:
    needs: tests
    name: Backend - Docker Build & Push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built first, pushed separately: on main the previous :main is deleted in between, so a build that
      # fails never leaves main without an image.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          # Single manifest, no attestation index: cleanup-ghcr.yaml deletes
          # untagged versions, which would include an index's children.
          provenance: false
          tags: ${{ env.IMAGE_BACKEND }}:${{ env.BRANCH_NAME }}
          cache-from: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache,mode=max

      # Avoid cache issues with the previous :main: delete it right before the new one is pushed.
      - name: Delete the previous :main image
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/delete-ghcr-tag.sh "${{ github.repository_owner }}" pianoml main

      # Same context and builder as the build above, so every layer is cached.
      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          provenance: false
          tags: ${{ env.IMAGE_BACKEND }}:${{ env.BRANCH_NAME }}
          cache-from: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache

  frontend:
    needs: tests
    name: Frontend - Docker Build & Push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local daemon first and smoke test it, so a broken image
      # is never pushed to the branch tag.
      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          provenance: false
          tags: pianoml-fe:smoke
          cache-from: type=registry,ref=${{ env.IMAGE_FRONTEND }}:cache

      - name: Smoke test image
        run: |
          set -euo pipefail

          IMAGE="pianoml-fe:smoke"
          docker run -d --rm --name fe-smoke -p 8080:4000 "$IMAGE"

          fail() {
            echo "::error::$1"
            docker logs fe-smoke || true
            docker stop fe-smoke || true
            exit 1
          }

          # Wait for readiness. The previous loop swallowed a permanently dead
          # container: once it ran out of attempts the step simply carried on.
          ready=false
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 3
          done
          [ "$ready" = true ] || fail "Container never became ready"

          # Cloud Run always sets X-Forwarded-For. @angular/ssr treats any
          # untrusted X-Forwarded-* header as a reason to fall back to
          # client-side rendering, returning 200 with an empty <app-root>, so a
          # plain request cannot tell working SSR from silently broken SSR.
          curl -fsS --compressed -H 'X-Forwarded-For: 1.2.3.4' \
            http://localhost:8080/ -o /tmp/smoke-ssr.html \
            || fail "Request with proxy headers failed"

          grep -q 'ng-server-context="ssr"' /tmp/smoke-ssr.html \
            || fail "SSR deopted to client-side rendering behind proxy headers"

          echo "SSR verified behind proxy headers"
          docker logs fe-smoke
          docker stop fe-smoke

      # Avoid cache issues with the previous :main: delete it right before the new one is pushed, once the
      # new image has passed the smoke test.
      - name: Delete the previous :main image
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/delete-ghcr-tag.sh "${{ github.repository_owner }}" pianoml-fe main

      # Same context and builder as the local build, so every layer is cached.
      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: ${{ env.IMAGE_FRONTEND }}:${{ env.BRANCH_NAME }}
          cache-from: type=registry,ref=${{ env.IMAGE_FRONTEND }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_FRONTEND }}:cache,mode=max

  # Promotion PR develop -> main, only once tests passed and images are built.
  # Called from here (instead of its own push trigger) so tests run once.
  promote:
    name: Release promotion
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-promotion.yaml
