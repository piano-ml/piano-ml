name: Build and Push to GHCR

on:
  push:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/pianoml
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/pianoml-fe
  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/test.yaml

  backend:
    needs: tests
    name: Backend - Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        working-directory: ./backend
        run: mvn --batch-mode --update-snapshots install

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        working-directory: ./backend
        run: docker build -t ${{ env.IMAGE_BACKEND }}:${{ env.BRANCH_NAME }} .

      - name: Push image
        run: docker push ${{ env.IMAGE_BACKEND }}:${{ env.BRANCH_NAME }}

  frontend:
    needs: tests
    name: Frontend - Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm --legacy-peer-deps install

      - name: Generate shader manifest
        working-directory: ./frontend
        run: npm run shaders:manifest

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build:prod

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        working-directory: ./frontend
        run: docker build -t ${{ env.IMAGE_FRONTEND }}:${{ env.BRANCH_NAME }} .

      - name: Smoke test image
        run: |
          docker run -d --rm --name fe-smoke -p 8080:80 ${{ env.IMAGE_FRONTEND }}:${{ env.BRANCH_NAME }}
          for i in {1..10}; do curl -fsS http://localhost:8080/ && break; sleep 3; done
          docker logs fe-smoke
          docker stop fe-smoke

      - name: Push image
        run: docker push ${{ env.IMAGE_FRONTEND }}:${{ env.BRANCH_NAME }}
