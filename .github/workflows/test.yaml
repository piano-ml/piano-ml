name: tests

on:
  # No push trigger: on pushes to main/develop build.yaml calls this workflow,
  # so a separate push run would only duplicate it.
  pull_request:
    branches: [ "main", "develop" ]
  workflow_call:
    outputs:
      backend-artifact:
        description: "Name of the uploaded backend artifact"
        value: ${{ jobs.backend.outputs.artifact-name }}
      frontend-artifact:
        description: "Name of the uploaded frontend artifact"
        value: ${{ jobs.frontend.outputs.artifact-name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # PR comments need a write token: not available to fork or Dependabot PRs,
  # which still get the coverage table in the job summary.
  CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-26.04
    outputs:
      artifact-name: backend-jar-${{ github.sha }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build & test
      working-directory: ./backend
      run: mvn --batch-mode --update-snapshots verify
    - name: Coverage report
      if: github.event_name == 'pull_request'
      uses: madrapps/jacoco-report@v1.7.2
      with:
        paths: ${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: Backend coverage
        update-comment: true
        comment-type: ${{ env.CAN_COMMENT == 'true' && 'both' || 'summary' }}
    - name: Upload coverage summary
      uses: actions/upload-artifact@v7
      with:
        name: coverage-backend-${{ github.sha }}
        path: backend/target/site/jacoco/jacoco.xml
        retention-days: 1
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v7
      with:
        name: backend-jar-${{ github.sha }}
        path: backend/target/backend.jar
        retention-days: 1

  frontend:
    runs-on: ubuntu-26.04
    outputs:
      artifact-name: frontend-dist-${{ github.sha }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26.13.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      working-directory: ./frontend
      run: npm --legacy-peer-deps install
    - name: Generate shader manifest
      working-directory: ./frontend
      run: npm run shaders:manifest
    - name: Generate sitemap (main branch only)
      if: github.ref == 'refs/heads/main'
      working-directory: ./frontend
      run: npm run generate:sitemap
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build:prod
    # Vitest runs the specs in headless Chromium through Playwright. The browser comes from Playwright's CDN
    # (cached per Playwright version); the runner image already has the system libraries it needs, so apt
    # (--with-deps: fonts we don't use, and a run failed when the Ubuntu mirrors were unreachable) only
    # runs if a library is actually missing.
    - name: Playwright version
      id: playwright
      working-directory: ./frontend
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Playwright Chromium
      working-directory: ./frontend
      timeout-minutes: 5
      run: |
        npx playwright install chromium
        missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) -exec ldd {} + 2>/dev/null | grep "not found" || true)
        if [ -n "$missing" ]; then
          echo "::warning::Chromium libraries missing, installing them with apt:"; echo "$missing"
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          npx playwright install-deps chromium
        fi
    # After build:prod, whose prebuild step generates src/app/core/api the specs import.
    - name: Dev proxy and CI script tests
      working-directory: ./frontend
      run: npm run test:scripts
    # *.webgl.spec.ts render on real WebGL: the runners have no GPU, so they only run locally.
    - name: Unit tests
      working-directory: ./frontend
      run: npx ng test --watch=false --coverage --exclude '**/*.webgl.spec.ts'
    - name: Coverage report
      if: always() && hashFiles('frontend/coverage/piano-ml/coverage-summary.json') != ''
      uses: davelosert/vitest-coverage-report-action@v2
      with:
        name: Frontend
        working-directory: ./frontend
        json-summary-path: coverage/piano-ml/coverage-summary.json
        json-final-path: coverage/piano-ml/coverage-final.json
        file-coverage-mode: changes
        comment-on: ${{ env.CAN_COMMENT == 'true' && 'pr' || 'none' }}
    - name: Upload coverage summary
      uses: actions/upload-artifact@v7
      with:
        name: coverage-frontend-${{ github.sha }}
        path: frontend/coverage/piano-ml/coverage-summary.json
        retention-days: 1
    - name: Upload dist artifact
      uses: actions/upload-artifact@v7
      with:
        name: frontend-dist-${{ github.sha }}
        path: frontend/dist/
        retention-days: 1

  summary:
    name: Tests passed
    runs-on: ubuntu-26.04
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check all tests passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more tests failed"
            exit 1
          fi
          echo "All tests passed"
