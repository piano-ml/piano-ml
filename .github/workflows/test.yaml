name: tests

on:
  # No push trigger: on pushes to main/develop build.yaml calls this workflow,
  # so a separate push run would only duplicate it.
  pull_request:
    branches: [ "main", "develop" ]
  workflow_call:
    outputs:
      backend-artifact:
        description: "Name of the uploaded backend artifact"
        value: ${{ jobs.backend.outputs.artifact-name }}
      frontend-artifact:
        description: "Name of the uploaded frontend artifact"
        value: ${{ jobs.frontend.outputs.artifact-name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: backend-jar-${{ github.sha }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build & test
      working-directory: ./backend
      run: mvn --batch-mode --update-snapshots verify
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v7
      with:
        name: backend-jar-${{ github.sha }}
        path: backend/target/backend.jar
        retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: frontend-dist-${{ github.sha }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26.13.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      working-directory: ./frontend
      run: npm --legacy-peer-deps install
    - name: Generate shader manifest
      working-directory: ./frontend
      run: npm run shaders:manifest
    - name: Generate sitemap (main branch only)
      if: github.ref == 'refs/heads/main'
      working-directory: ./frontend
      run: npm run generate:sitemap
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build:prod
    # After build:prod, whose prebuild step generates src/app/core/api the specs import.
    - name: Unit tests
      working-directory: ./frontend
      run: npx ng test --watch=false --browsers=ChromeHeadless
    - name: Upload dist artifact
      uses: actions/upload-artifact@v7
      with:
        name: frontend-dist-${{ github.sha }}
        path: frontend/dist/
        retention-days: 1

  summary:
    name: Tests passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check all tests passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more tests failed"
            exit 1
          fi
          echo "All tests passed"
