name: Trigger release-please after merge

on:
  push:
    branches:
      - develop

jobs:
  trigger-release:
    if: github.event.commits[0].message != 'fix: trigger release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create empty commit to trigger release-please
        run: |
          git commit --allow-empty -m "fix: trigger release"
          git push origin develop
