# Job profile configuration - optimized for batch processing
spring:
  # Disable web server completely
  main:
    web-application-type: none
    # Disable lazy initialization for job context (we want faster startup for jobs)
    lazy-initialization: false
  # Disable unnecessary auto-configurations for job context
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.DispatcherServletAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.ServletWebServerFactoryAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.HttpEncodingAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.MultipartAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # Disable database changelog/migration tools
  liquibase:
    enabled: false
  datasource:
    username: web
    password: web
  cloud:
    gcp:
      sql:
        enabled: false

jwt:
  expiration-ms: 36000000
