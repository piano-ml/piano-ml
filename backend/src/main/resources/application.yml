spring:
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/pianoml
    hikari:
      maximum-pool-size: 10
  cloud:
    gcp:
      sql:
        enabled: false
    aws:
      region:
        static: us-east-1
      endpoint: https://a875d3bbcfc175fef5a7d5506780ff7f.r2.cloudflarestorage.com
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    default-schema: pianoml
  main:
    lazy-initialization: true

server:
  tomcat:
    max-threads: 50

jwt:
  secret: your-super-secret-key-that-is-long-enough
  expiration-ms: 3600000

aws:
  s3:
    bucket-name: pianoml-media
