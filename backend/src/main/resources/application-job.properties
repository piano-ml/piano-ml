# Job profile configuration - optimized for batch processing
# Disable web server completely
spring.main.web-application-type=none
# Disable unnecessary auto-configurations for job context
# Spring Boot 4 class names (Boot silently ignores names that don't exist)
spring.autoconfigure.exclude=org.springframework.boot.webmvc.autoconfigure.WebMvcAutoConfiguration,org.springframework.boot.webmvc.autoconfigure.DispatcherServletAutoConfiguration,org.springframework.boot.tomcat.autoconfigure.servlet.TomcatServletWebServerAutoConfiguration,org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration,org.springframework.boot.servlet.autoconfigure.HttpEncodingAutoConfiguration,org.springframework.boot.servlet.autoconfigure.MultipartAutoConfiguration,org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# Disable lazy initialization for job context (we want faster startup for jobs)
spring.main.lazy-initialization=false
# Disable database changelog/migration tools
spring.liquibase.enabled=false
