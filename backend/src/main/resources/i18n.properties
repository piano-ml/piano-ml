# The site's languages, source language first (the fallback): the codes of the i18n section of
# frontend/angular.json, which SupportedLocalesTest checks this list against. Loaded by SupportedLocales
# (its own file, so a test application.properties does not hide it).
i18n.locales=en,es,fr,it,zh-Hans,de,nl,pl,sv,th,uk,ko
