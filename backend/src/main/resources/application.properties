spring.application.name=backend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/pianoml
spring.cloud.gcp.sql.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none
# Accounts whose scores are purged (instead of moved to the "junk" user) when the account deletes itself.
# Comma-separated emails; the acceptance test account, so test runs leave nothing behind.
pianoml.account.purge-scores-on-delete=acceptance-test@example.com
spring.liquibase.default-schema=pianoml
spring.main.lazy-initialization=true
# --- Low-resource tuning: 1 slow CPU, low RAM ---
# Tomcat: few worker threads (fewer stacks, less context switching on 1 CPU).
# Replaces server.tomcat.max-threads, a key Boot no longer reads.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=200
server.tomcat.accept-count=50
# Hikari: ~2x CPU cores is enough; keep one idle connection, release the rest
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
# Hibernate: smaller query plan cache (default 2048 entries)
spring.jpa.properties.hibernate.query.plan_cache_max_size=256
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=32
spring.jpa.open-in-view=false
jwt.secret=your-super-secret-key-that-is-long-enough
jwt.expiration-ms=3600000
# AWS S3 Configuration
spring.cloud.aws.region.static=us-east-1
aws.s3.bucket-name=pianoml-media
spring.cloud.aws.endpoint=https://a875d3bbcfc175fef5a7d5506780ff7f.r2.cloudflarestorage.com

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true



# Spring Boot 4 uses Jackson 3: keep the Jackson 2 defaults the API was built on
spring.jackson.use-jackson2-defaults=true
