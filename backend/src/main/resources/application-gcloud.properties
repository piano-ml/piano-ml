# Google Cloud Configuration

spring.cloud.gcp.sql.enabled=true
spring.cloud.gcp.sql.database-name=pianoml
spring.cloud.gcp.sql.instance-connection-name=sectrack:us-central1:pianoml-db
# spring.datasource.password=by_env

# JobName name = JobName.of("[PROJECT]", "[LOCATION]", "[JOB]");
gcloud.project-id=sectrack
gcloud.location=us-central1
gcloud.run.job-name=pianoml-workload

# Service Account Configuration (optional - if using service account key)
gcloud.credentials.location=classpath:gcp-service-account.json


#In production, it's a best practice to use a service account for authentication rather than user credentials. This provides better security and control.
#
#Create a Service Account:
#In the Google Cloud Console, navigate to IAM & Admin > Service Accounts.
#Click "Create Service Account," give it a name, and optionally a description.
#Grant Necessary Permissions:
#Grant the service account the minimum necessary IAM roles to execute Cloud Run jobs. The Cloud Run Job Invoker role is typically required. You might also need other roles depending on what your job interacts with (e.g., Storage Object Viewer if it reads from Cloud Storage).
#Attach Service Account to Compute Resource:
#For Cloud Run Services or Cloud Functions: When deploying your Cloud Run service or Cloud Function that will trigger the job, specify this service account. Cloud Run and Cloud Functions can automatically use the attached service account's credentials.
#For Compute Engine VMs or GKE Pods: When creating your VM instance or GKE node pool, specify the service account. Applications running on these resources will then automatically use the attached service account.
#For other environments (e.g., on-premises servers, other cloud providers): You would download a JSON key for the service account.
#Important Security Note: Downloading service account keys should be done with extreme caution as they are highly sensitive. Store them securely and rotate them regularly. It's generally preferred to use managed identities (like those provided by Cloud Run, Compute Engine, or GKE) where possible, as they handle key management for you.
