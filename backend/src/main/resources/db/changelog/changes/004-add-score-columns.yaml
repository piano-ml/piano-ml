databaseChangeLog:
  - changeSet:
      id: 5
      author: jules
      changes:
        - addColumn:
            schemaName: pianoml
            tableName: "score"
            columns:
              - column:
                  name: public_domain
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: exercise
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: play_count
                  type: BIGINT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false

