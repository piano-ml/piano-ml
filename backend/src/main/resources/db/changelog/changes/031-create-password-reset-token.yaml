# Password reset links (#442): one row per link sent by email, until it is used or expires.
# - only the SHA-256 of the token is stored: a database leak gives no usable link;
# - a used link, and the previous links of a user sent a new one, are ended by setting expires_at to now;
#   rows are kept a day, to cap the emails sent to an account per 24 hours, then deleted (PasswordResetService);
# - rows go away with their user (ON DELETE CASCADE).
databaseChangeLog:
  - changeSet:
      id: 031-1-create-password-reset-token
      author: pianoml
      changes:
        - createTable:
            schemaName: pianoml
            tableName: password_reset_token
            columns:
              - column: { name: id, type: UUID, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_password_reset_token } }
              - column: { name: user_id, type: UUID, constraints: { nullable: false } }
              - column: { name: token_hash, type: VARCHAR(64), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_password_reset_token_hash } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: expires_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableSchemaName: pianoml
            baseTableName: password_reset_token
            baseColumnNames: user_id
            constraintName: fk_password_reset_token_user
            referencedTableSchemaName: pianoml
            referencedTableName: user
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            schemaName: pianoml
            tableName: password_reset_token
            indexName: idx_password_reset_token_user
            columns:
              - column: { name: user_id }
